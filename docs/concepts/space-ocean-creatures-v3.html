<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>太空海洋生物造型概念 v3</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
        background: #06151f;
        color: #e9f5f8;
        --ink: #06151f;
        --surface: #091e2a;
        --surface-strong: #0d2633;
        --line: #294959;
        --muted: #87a5b4;
        --blue: #4b96ca;
        --blue-light: #83c9e2;
        --coral: #ef847a;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        margin: 0;
        background: var(--ink);
      }

      main {
        width: min(100%, 1380px);
        margin: 0 auto;
        padding: 28px 40px 42px;
      }

      header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(270px, 390px);
        gap: 48px;
        align-items: end;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--line);
      }

      h1, h2, p { margin: 0; }

      h1 {
        max-width: 760px;
        font-size: clamp(34px, 4.2vw, 62px);
        font-weight: 650;
        line-height: 1;
      }

      header p {
        color: #b5ccd6;
        font-size: 14px;
        line-height: 1.65;
      }

      .body-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(340px, .75fr);
        min-height: 480px;
        border-bottom: 1px solid var(--line);
      }

      .hero-creature {
        position: relative;
        display: grid;
        place-items: center;
        min-width: 0;
        overflow: hidden;
        border-right: 1px solid var(--line);
        background:
          linear-gradient(90deg, rgb(111 183 214 / .035) 1px, transparent 1px),
          linear-gradient(rgb(111 183 214 / .035) 1px, transparent 1px),
          var(--surface);
        background-size: 48px 48px;
      }

      .hero-creature::after {
        position: absolute;
        inset: auto 0 0;
        height: 34%;
        background: linear-gradient(180deg, transparent, rgb(2 12 18 / .34));
        content: "";
        pointer-events: none;
      }

      .hero-creature > svg {
        position: relative;
        z-index: 1;
        width: min(94%, 920px);
        height: auto;
      }

      .specs {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 30px 32px 28px;
        background: var(--surface-strong);
      }

      .intro {
        color: #c3d7df;
        font-size: 17px;
        line-height: 1.65;
      }

      .rules {
        margin-top: 28px;
        border-top: 1px solid var(--line);
      }

      .rule {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 16px;
        padding: 15px 0;
        border-bottom: 1px solid rgb(41 73 89 / .62);
      }

      .rule strong,
      .meta-label {
        color: var(--blue-light);
        font: 600 11px/1.35 Consolas, "SFMono-Regular", monospace;
      }

      .rule span {
        color: #a9c0ca;
        font-size: 13px;
        line-height: 1.55;
      }

      .swatches {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        height: 34px;
        margin-top: 12px;
      }

      .swatches i:nth-child(1) { background: #06151f; }
      .swatches i:nth-child(2) { background: #183c4e; }
      .swatches i:nth-child(3) { background: #4b96ca; }
      .swatches i:nth-child(4) { background: #83c9e2; }
      .swatches i:nth-child(5) { background: #ef847a; }

      .motion-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(340px, .75fr);
        min-height: 288px;
      }

      .turn-study,
      .jelly-study {
        padding: 24px 28px 20px;
      }

      .turn-study {
        border-right: 1px solid var(--line);
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 8px;
      }

      h2 {
        font-size: 19px;
        font-weight: 650;
      }

      .section-head p {
        max-width: 440px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        text-align: right;
      }

      .turn-study svg,
      .jelly-study svg {
        display: block;
        width: 100%;
        height: 195px;
      }

      .jelly-study {
        background: rgb(13 38 51 / .54);
      }

      .fine-print {
        margin-top: 18px;
        color: #6f8e9d;
        font: 10px/1.6 Consolas, "SFMono-Regular", monospace;
      }

      @media (max-width: 900px) {
        main { padding: 22px 18px 32px; }
        header { grid-template-columns: 1fr; gap: 16px; }
        .body-grid,
        .motion-grid { grid-template-columns: 1fr; }
        .hero-creature { min-height: 420px; border-right: 0; border-bottom: 1px solid var(--line); }
        .specs { min-height: 400px; }
        .turn-study { border-right: 0; border-bottom: 1px solid var(--line); }
      }

      @media (max-width: 560px) {
        h1 { font-size: 36px; }
        .hero-creature { min-height: 300px; }
        .specs, .turn-study, .jelly-study { padding: 22px 18px; }
        .rule { grid-template-columns: 78px 1fr; gap: 12px; }
        .section-head { display: block; }
        .section-head p { margin-top: 8px; text-align: left; }
        .turn-study svg { height: 235px; }
        .jelly-study svg { height: 180px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>太空海洋生物造型</h1>
        <p>这一轮只审核剪影、比例和动作逻辑。海豚不再使用 emoji，也不靠笑脸制造亲和感。</p>
      </header>

      <section class="body-grid" aria-label="海豚主造型和设计约束">
        <div class="hero-creature">
          <svg viewBox="0 0 980 470" role="img" aria-label="近水平侧视的简化海豚和两只短触手水母">
            <defs>
              <symbol id="dolphin" viewBox="0 0 900 390">
                <g>
                  <path d="M242 183 C199 169 158 144 116 108 C130 151 164 187 214 202 C163 216 123 246 91 286 C145 271 193 249 243 222 L282 201 Z" fill="#347daf" />
                  <path d="M237 181 C288 142 359 121 446 121 C533 121 609 136 671 160 C700 171 719 183 728 194 C758 194 793 200 834 211 C851 216 853 225 837 230 C800 242 759 239 724 228 C684 259 625 279 553 286 C464 294 373 278 307 247 C267 228 237 205 237 181 Z" fill="#4b96ca" />
                  <path d="M435 123 C453 88 488 65 531 61 C512 81 504 102 512 130 Z" fill="#347daf" />
                  <path d="M560 281 C579 313 602 337 632 354 C603 355 570 334 542 294 Z" fill="#347daf" />
                  <path d="M307 240 C386 268 479 277 562 261 C620 250 671 232 708 211 C686 245 625 273 550 281 C461 289 373 273 307 240 Z" fill="#78bad8" opacity=".64" />
                  <path d="M726 195 C751 195 780 199 810 207 C781 207 756 211 735 219 C720 224 706 221 693 215 C704 206 715 200 726 195 Z" fill="#62add5" opacity=".68" />
                  <circle cx="706" cy="191" r="5" fill="#0d3042" />
                </g>
              </symbol>

              <symbol id="jelly" viewBox="0 0 180 150">
                <path d="M20 72 C22 31 51 10 90 10 C129 10 158 31 160 72 C131 88 49 88 20 72 Z" fill="#2f7595" stroke="#83c9e2" stroke-width="3" />
                <path d="M30 71 C52 57 66 81 89 68 C111 56 126 80 151 70" fill="none" stroke="#b3e2ee" stroke-width="2" opacity=".62" />
                <g fill="none" stroke="#68b6d4" stroke-width="3" stroke-linecap="round">
                  <path d="M45 79 C39 91 49 101 42 113" />
                  <path d="M75 82 C68 96 79 108 72 121" />
                  <path d="M106 82 C99 95 111 107 105 119" />
                  <path d="M136 79 C130 91 140 99 135 110" />
                </g>
              </symbol>
            </defs>

            <g fill="none" stroke="#254858" stroke-width="1.2" opacity=".8">
              <path d="M18 100 C188 52 325 112 493 74 C660 37 799 78 962 45" />
              <path d="M12 400 C176 365 326 421 492 383 C646 348 802 388 968 350" />
            </g>

            <g fill="#5ba5c8" opacity=".65">
              <rect x="76" y="208" width="6" height="6" />
              <rect x="169" y="362" width="4" height="4" />
              <rect x="288" y="67" width="5" height="5" />
              <rect x="758" y="79" width="7" height="7" />
              <rect x="887" y="330" width="5" height="5" />
              <rect x="927" y="145" width="3" height="3" />
            </g>

            <use href="#dolphin" x="121" y="65" width="760" height="330" />
            <use href="#jelly" x="44" y="76" width="110" height="92" />
            <use href="#jelly" x="811" y="314" width="84" height="70" opacity=".82" />

            <g fill="none" stroke="#ef847a" stroke-width="1.5" opacity=".78">
              <path d="M304 204 L304 326" />
              <path d="M294 214 L304 204 L314 214 M294 316 L304 326 L314 316" />
              <path d="M315 325 L417 325" />
            </g>
            <text x="426" y="329" fill="#ef847a" font-family="Consolas, monospace" font-size="11">BODY DEPTH 1.0</text>
            <text x="60" y="183" fill="#87a5b4" font-family="Consolas, monospace" font-size="10">SHORT LOCAL CHAINS</text>
          </svg>
        </div>

        <aside class="specs">
          <div>
            <p class="intro">轮廓借鉴真实宽吻海豚的长身体、短钝吻和后置尾鳍，再压缩成适合低对比背景的简单形态。</p>
            <div class="rules">
              <div class="rule"><strong>身体</strong><span>约 2.3:1，巡航脊线接近水平。头部不参与大幅波动。</span></div>
              <div class="rule"><strong>尾部</strong><span>尾柄先收窄，尾鳍明确留在身体后方，不折回腹部。</span></div>
              <div class="rule"><strong>表情</strong><span>单个小眼点，无笑线、腮红或大面积高光。</span></div>
              <div class="rule"><strong>水母</strong><span>四条短触手，最大伸展不超过钟罩高度约 0.7 倍。</span></div>
            </div>
          </div>
          <div>
            <div class="meta-label">颜色只服务层级</div>
            <div class="swatches" aria-label="概念配色"><i></i><i></i><i></i><i></i><i></i></div>
            <p class="fine-print">比例参考成熟海豚运动剪影，路径为本项目重新绘制。此页不含动画实现。</p>
          </div>
        </aside>
      </section>

      <section class="motion-grid" aria-label="连续掉头和水母动作设计">
        <div class="turn-study">
          <div class="section-head">
            <h2>连续短半径回旋</h2>
            <p>位置、朝向和曲率连续变化。中间帧是侧背视角压缩，不是瞬时镜像。</p>
          </div>
          <svg viewBox="0 0 760 205" role="img" aria-label="海豚沿紧凑曲线路径连续完成五帧掉头">
            <defs>
              <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                <path d="M0 0 L8 4 L0 8 Z" fill="#ef847a" />
              </marker>
            </defs>
            <path d="M98 78 C267 24 470 38 522 101 C557 143 463 177 315 164 C232 157 174 143 126 125" fill="none" stroke="#ef847a" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)" opacity=".88" />
            <g opacity=".92">
              <use href="#dolphin" x="46" y="33" width="180" height="78" />
              <use href="#dolphin" x="270" y="27" width="150" height="65" transform="rotate(5 345 59)" opacity=".82" />
              <use href="#dolphin" x="490" y="70" width="48" height="78" opacity=".64" />
              <use href="#dolphin" x="320" y="120" width="150" height="65" transform="translate(790 0) scale(-1 1) rotate(5 395 152)" opacity=".82" />
              <use href="#dolphin" x="92" y="112" width="180" height="78" transform="translate(364 0) scale(-1 1)" />
            </g>
            <g fill="#87a5b4" font-family="Consolas, monospace" font-size="9">
              <text x="78" y="23">CRUISE</text>
              <text x="303" y="20">HEAD ENTERS ARC</text>
              <text x="485" y="63">FORESHORTEN</text>
              <text x="346" y="202">TAIL FOLLOWS</text>
              <text x="116" y="202">ACCELERATE OUT</text>
            </g>
          </svg>
        </div>

        <div class="jelly-study">
          <div class="section-head">
            <h2>水母局部约束</h2>
          </div>
          <svg viewBox="0 0 360 205" role="img" aria-label="水母钟罩呼吸和短触手长度限制">
            <use href="#jelly" x="34" y="23" width="190" height="158" />
            <path d="M244 72 L244 155 M236 80 L244 72 L252 80 M236 147 L244 155 L252 147" fill="none" stroke="#ef847a" stroke-width="2" />
            <path d="M258 72 L331 72 M258 155 L331 155" fill="none" stroke="#35596a" stroke-width="1" />
            <text x="265" y="103" fill="#ef847a" font-family="Consolas, monospace" font-size="10">HARD LIMIT</text>
            <text x="265" y="120" fill="#87a5b4" font-family="Consolas, monospace" font-size="9">RESET ON WRAP</text>
            <text x="265" y="136" fill="#87a5b4" font-family="Consolas, monospace" font-size="9">LOCAL CHAIN</text>
          </svg>
        </div>
      </section>
    </main>
  </body>
</html>
